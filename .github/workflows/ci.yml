name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -e

          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")

          echo "Backend version: $BACKEND_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"

          if [[ ! "$BACKEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Backend version '$BACKEND_VERSION' is not a closed version. Use MAJOR.MINOR.PATCH, for example 1.2.3."
            exit 1
          fi

          if [[ ! "$FRONTEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Frontend version '$FRONTEND_VERSION' is not a closed version. Use MAJOR.MINOR.PATCH, for example 1.2.3."
            exit 1
          fi

          echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_version=$FRONTEND_VERSION" >> "$GITHUB_OUTPUT"

          echo "Version validation passed."

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if versions already exist
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          set -e

          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/architecture-study-backend"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/architecture-study-frontend"

          echo "Checking backend image..."

          if docker manifest inspect "$BACKEND_IMAGE:$BACKEND_VERSION" > /dev/null 2>&1; then
            echo "::error::Backend image version $BACKEND_VERSION already exists: $BACKEND_IMAGE:$BACKEND_VERSION"
            exit 1
          fi

          echo "Backend version $BACKEND_VERSION is available."


          echo "Checking frontend image..."

          if docker manifest inspect "$FRONTEND_IMAGE:$FRONTEND_VERSION" > /dev/null 2>&1; then
            echo "::error::Frontend image version $FRONTEND_VERSION already exists: $FRONTEND_IMAGE:$FRONTEND_VERSION"
            exit 1
          fi

          echo "Frontend version $FRONTEND_VERSION is available."

      - name: Build backend image
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:$BACKEND_VERSION \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest \
            ./backend

      - name: Build frontend image
        env:
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:$FRONTEND_VERSION \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest \
            ./frontend

      - name: Push backend image
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:$BACKEND_VERSION

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest

      - name: Push frontend image
        env:
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:$FRONTEND_VERSION

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - docker

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /opt/architecture-study

            docker compose \
              -f docker-compose.prod.yml \
              pull frontend backend

            docker compose \
              -f docker-compose.prod.yml \
              up -d frontend backend
