apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: architecture-study-backend-dev
  labels:
    app: backend
    environment: dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        environment: dev

    spec:
      containers:
        - name: backend
          image: ghcr.io/reimedeiros/architecture-study-backend:1.0.3

          ports:
            - containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
