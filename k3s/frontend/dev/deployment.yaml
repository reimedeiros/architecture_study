apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: architecture-study-frontend-dev
  labels:
    app: frontend
    environment: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
        environment: dev

    spec:
      containers:
        - name: frontend
          image: ghcr.io/reimedeiros/architecture-study-frontend:1.0.3

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
