name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/architecture-study

            docker compose \
              -f docker-compose.prod.yml \
              pull frontend backend 

            docker compose \
              -f docker-compose.prod.yml \
              up -d frontend backend
