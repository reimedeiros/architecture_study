apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: architecture-study-database-dev
  labels:
    app: database
    environment: dev

spec:
  serviceName: database
  replicas: 1

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database
        environment: dev

    spec:
      containers:
        - name: database
          image: mysql:8.4

          ports:
            - containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: MYSQL_PASSWORD

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: MYSQL_ROOT_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: database-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 10Gi
