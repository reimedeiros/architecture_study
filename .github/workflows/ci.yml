name: CI/CD

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/**"

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push'

    outputs:
      backend_version: ${{ steps.versions.outputs.backend_version }}
      frontend_version: ${{ steps.versions.outputs.frontend_version }}

      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}

      build_backend: ${{ steps.release.outputs.build_backend }}
      build_frontend: ${{ steps.release.outputs.build_frontend }}

      environment: ${{ steps.branch.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # BRANCH
      # ---------------------------------------------------------

      - name: Determine branch and environment
        id: branch
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Branch: $BRANCH"

          case "$BRANCH" in

            feat/*|feature/*|fix/*|hotfix/*)
              ENVIRONMENT="dev"
              BRANCH_TYPE="candidate"
              ;;

            develop)
              ENVIRONMENT="dev"
              BRANCH_TYPE="develop"
              ;;

            main)
              ENVIRONMENT="prod"
              BRANCH_TYPE="release"
              ;;

            *)
              echo "::error::Unsupported branch: $BRANCH"
              exit 1
              ;;

          esac

          echo "Branch type: $BRANCH_TYPE"
          echo "Environment: $ENVIRONMENT"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # CHANGE DETECTION
      # ---------------------------------------------------------

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          set -e

          echo "Comparing:"
          echo "Before: ${{ github.event.before }}"
          echo "Current: ${{ github.sha }}"

          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "::warning::Initial push detected. Treating all application code as changed."

            BACKEND_CHANGED=true
            FRONTEND_CHANGED=true
          else
            CHANGED_FILES=$(git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}")

            echo ""
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo ""

            if echo "$CHANGED_FILES" | grep -q '^backend/'; then
              BACKEND_CHANGED=true
              echo "Backend changed."
            else
              BACKEND_CHANGED=false
              echo "Backend did not change."
            fi

            if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
              FRONTEND_CHANGED=true
              echo "Frontend changed."
            else
              FRONTEND_CHANGED=false
              echo "Frontend did not change."
            fi
          fi

          echo "backend_changed=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # VERSION
      # ---------------------------------------------------------

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -e

          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")

          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            BACKEND_PREVIOUS_VERSION="$BACKEND_VERSION"
            FRONTEND_PREVIOUS_VERSION="$FRONTEND_VERSION"
          else
            BACKEND_PREVIOUS_VERSION=$(git show \
              "${{ github.event.before }}:backend/package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

            FRONTEND_PREVIOUS_VERSION=$(git show \
              "${{ github.event.before }}:frontend/package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          fi

          echo "========================================"
          echo "Versions"
          echo "========================================"

          echo "Backend current:   $BACKEND_VERSION"
          echo "Backend previous:  $BACKEND_PREVIOUS_VERSION"
          echo ""
          echo "Frontend current:  $FRONTEND_VERSION"
          echo "Frontend previous: $FRONTEND_PREVIOUS_VERSION"
          echo ""

          # -----------------------------------------------------
          # SemVer
          #
          # Closed:
          # 1.0.3
          #
          # Open:
          # 1.0.3-rc1
          # 1.0.3-beta1
          # 1.0.3-alpha1
          # -----------------------------------------------------

          if [[ "$BACKEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BACKEND_CLOSED=true
          elif [[ "$BACKEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            BACKEND_CLOSED=false
          else
            echo "::error::Invalid backend version: $BACKEND_VERSION"
            exit 1
          fi

          if [[ "$FRONTEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FRONTEND_CLOSED=true
          elif [[ "$FRONTEND_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            FRONTEND_CLOSED=false
          else
            echo "::error::Invalid frontend version: $FRONTEND_VERSION"
            exit 1
          fi

          echo "Backend closed:  $BACKEND_CLOSED"
          echo "Frontend closed: $FRONTEND_CLOSED"

          echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_version=$FRONTEND_VERSION" >> "$GITHUB_OUTPUT"

          echo "backend_previous_version=$BACKEND_PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_previous_version=$FRONTEND_PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          echo "backend_closed=$BACKEND_CLOSED" >> "$GITHUB_OUTPUT"
          echo "frontend_closed=$FRONTEND_CLOSED" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # RELEASE POLICY
      # ---------------------------------------------------------

      - name: Validate release policy
        id: release
        shell: bash
        env:
          BRANCH_TYPE: ${{ steps.branch.outputs.branch_type }}
          ENVIRONMENT: ${{ steps.branch.outputs.environment }}

          BACKEND_CHANGED: ${{ steps.changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend_changed }}

          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}

          BACKEND_PREVIOUS_VERSION: ${{ steps.versions.outputs.backend_previous_version }}
          FRONTEND_PREVIOUS_VERSION: ${{ steps.versions.outputs.frontend_previous_version }}

          BACKEND_CLOSED: ${{ steps.versions.outputs.backend_closed }}
          FRONTEND_CLOSED: ${{ steps.versions.outputs.frontend_closed }}

        run: |
          set -e

          BUILD_BACKEND=false
          BUILD_FRONTEND=false

          echo "========================================"
          echo "Release Policy"
          echo "========================================"

          echo "Branch type: $BRANCH_TYPE"
          echo "Environment: $ENVIRONMENT"
          echo ""

          # -----------------------------------------------------
          # BRANCH VERSION POLICY
          # -----------------------------------------------------

          case "$BRANCH_TYPE" in

            candidate)

              echo "Candidate branch detected."
              echo "Only OPEN versions are allowed."
              echo ""

              if [[ "$BACKEND_CLOSED" == "true" ]]; then
                echo "::error::Backend version '$BACKEND_VERSION' is closed."
                echo "::error::Branches feat/*, feature/*, fix/* and hotfix/* require an open version."
                exit 1
              fi

              if [[ "$FRONTEND_CLOSED" == "true" ]]; then
                echo "::error::Frontend version '$FRONTEND_VERSION' is closed."
                echo "::error::Branches feat/*, feature/*, fix/* and hotfix/* require an open version."
                exit 1
              fi

              ;;

            develop)

              echo "Develop branch detected."
              echo "Open and closed versions are allowed."
              echo ""

              ;;

            release)

              echo "Main branch detected."
              echo "Only CLOSED versions are allowed."
              echo ""

              if [[ "$BACKEND_CLOSED" != "true" ]]; then
                echo "::error::Backend version '$BACKEND_VERSION' is open."
                echo "::error::Main requires a closed version such as 1.0.3."
                exit 1
              fi

              if [[ "$FRONTEND_CLOSED" != "true" ]]; then
                echo "::error::Frontend version '$FRONTEND_VERSION' is open."
                echo "::error::Main requires a closed version such as 1.0.3."
                exit 1
              fi

              ;;

            *)
              echo "::error::Unknown branch type."
              exit 1
              ;;

          esac

          # -----------------------------------------------------
          # BACKEND BUILD DECISION
          # -----------------------------------------------------

          echo "========================================"
          echo "Backend"
          echo "========================================"

          echo "Changed:          $BACKEND_CHANGED"
          echo "Previous version: $BACKEND_PREVIOUS_VERSION"
          echo "Current version:  $BACKEND_VERSION"

          if [[ "$BACKEND_CHANGED" == "true" ]]; then

            if [[ "$BACKEND_VERSION" == "$BACKEND_PREVIOUS_VERSION" ]]; then
              echo "::error::Backend code changed, but version remained $BACKEND_VERSION."
              echo "::error::Increment backend/package.json version."
              exit 1
            fi

            echo "Backend code changed and version changed."
            echo "Backend will be built."

            BUILD_BACKEND=true

          else

            if [[ "$BACKEND_VERSION" == "$BACKEND_PREVIOUS_VERSION" ]]; then
              echo "Backend code and version did not change."
              echo "Backend will be skipped."

            else
              echo "Backend version changed without code changes."
              echo "Backend will be built."

              BUILD_BACKEND=true
            fi

          fi

          # -----------------------------------------------------
          # FRONTEND BUILD DECISION
          # -----------------------------------------------------

          echo ""
          echo "========================================"
          echo "Frontend"
          echo "========================================"

          echo "Changed:          $FRONTEND_CHANGED"
          echo "Previous version: $FRONTEND_PREVIOUS_VERSION"
          echo "Current version:  $FRONTEND_VERSION"

          if [[ "$FRONTEND_CHANGED" == "true" ]]; then

            if [[ "$FRONTEND_VERSION" == "$FRONTEND_PREVIOUS_VERSION" ]]; then
              echo "::error::Frontend code changed, but version remained $FRONTEND_VERSION."
              echo "::error::Increment frontend/package.json version."
              exit 1
            fi

            echo "Frontend code changed and version changed."
            echo "Frontend will be built."

            BUILD_FRONTEND=true

          else

            if [[ "$FRONTEND_VERSION" == "$FRONTEND_PREVIOUS_VERSION" ]]; then
              echo "Frontend code and version did not change."
              echo "Frontend will be skipped."

            else
              echo "Frontend version changed without code changes."
              echo "Frontend will be built."

              BUILD_FRONTEND=true
            fi

          fi

          echo ""
          echo "========================================"
          echo "Release decision"
          echo "========================================"

          echo "Environment:    $ENVIRONMENT"
          echo "Build backend:  $BUILD_BACKEND"
          echo "Build frontend: $BUILD_FRONTEND"

          echo "build_backend=$BUILD_BACKEND" >> "$GITHUB_OUTPUT"
          echo "build_frontend=$BUILD_FRONTEND" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # GHCR
      # ---------------------------------------------------------

      - name: Login to GHCR
        if: steps.release.outputs.build_backend == 'true' || steps.release.outputs.build_frontend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # IMAGE EXISTENCE
      # ---------------------------------------------------------

      - name: Check if backend version already exists
        if: steps.release.outputs.build_backend == 'true'
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
        run: |
          set -e

          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/architecture-study-backend"

          echo "Checking backend image..."

          if docker manifest inspect "$BACKEND_IMAGE:$BACKEND_VERSION" > /dev/null 2>&1; then
            echo "::error::Backend image version $BACKEND_VERSION already exists."
            echo "::error::$BACKEND_IMAGE:$BACKEND_VERSION"
            exit 1
          fi

          echo "Backend version $BACKEND_VERSION is available."

      - name: Check if frontend version already exists
        if: steps.release.outputs.build_frontend == 'true'
        env:
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          set -e

          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/architecture-study-frontend"

          echo "Checking frontend image..."

          if docker manifest inspect "$FRONTEND_IMAGE:$FRONTEND_VERSION" > /dev/null 2>&1; then
            echo "::error::Frontend image version $FRONTEND_VERSION already exists."
            echo "::error::$FRONTEND_IMAGE:$FRONTEND_VERSION"
            exit 1
          fi

          echo "Frontend version $FRONTEND_VERSION is available."

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build backend image
        if: steps.release.outputs.build_backend == 'true'
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:$BACKEND_VERSION \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest \
            ./backend

      - name: Build frontend image
        if: steps.release.outputs.build_frontend == 'true'
        env:
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:$FRONTEND_VERSION \
            -t ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest \
            ./frontend

      # ---------------------------------------------------------
      # PUSH
      # ---------------------------------------------------------

      - name: Push backend image
        if: steps.release.outputs.build_backend == 'true'
        env:
          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:$BACKEND_VERSION

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-backend:latest

      - name: Push frontend image
        if: steps.release.outputs.build_frontend == 'true'
        env:
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:$FRONTEND_VERSION

          docker push \
            ghcr.io/${{ github.repository_owner }}/architecture-study-frontend:latest

  # =============================================================
  # DEV
  # =============================================================

  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest

    needs:
      - docker

    if: |
      github.event_name == 'push' &&
      needs.docker.result == 'success' &&
      (
        needs.docker.outputs.environment == 'dev' ||
        needs.docker.outputs.environment == 'prod'
      )

    steps:
      - name: DEV deployment placeholder
        run: |
          echo "========================================"
          echo "DEV DEPLOYMENT"
          echo "========================================"

          echo "Backend version:  ${{ needs.docker.outputs.backend_version }}"
          echo "Frontend version: ${{ needs.docker.outputs.frontend_version }}"

          echo ""
          echo "DEV deployment will be connected to K3s."
          echo "Environment: DEV"

  # =============================================================
  # PROD
  # =============================================================

  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest

    needs:
      - docker

    if: |
      github.event_name == 'push' &&
      needs.docker.result == 'success' &&
      needs.docker.outputs.environment == 'prod'

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          BACKEND_VERSION: ${{ needs.docker.outputs.backend_version }}
          FRONTEND_VERSION: ${{ needs.docker.outputs.frontend_version }}
          BUILD_BACKEND: ${{ needs.docker.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.docker.outputs.build_frontend }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

          envs: BACKEND_VERSION,FRONTEND_VERSION,BUILD_BACKEND,BUILD_FRONTEND

          script: |
            set -e

            cd /opt/architecture-study

            echo "Backend version:  ${BACKEND_VERSION}"
            echo "Frontend version: ${FRONTEND_VERSION}"

            echo "Build backend:    ${BUILD_BACKEND}"
            echo "Build frontend:   ${BUILD_FRONTEND}"

            if [[ "$BUILD_BACKEND" == "true" ]]; then

              if ! grep -q '^BACKEND_VERSION=' .env; then
                echo "ERROR: BACKEND_VERSION not found in .env"
                exit 1
              fi

              sed -i \
                "s/^BACKEND_VERSION=.*/BACKEND_VERSION=${BACKEND_VERSION}/" \
                .env

              docker compose \
                -f docker-compose.prod.yml \
                pull backend

              docker compose \
                -f docker-compose.prod.yml \
                up -d backend
            fi

            if [[ "$BUILD_FRONTEND" == "true" ]]; then

              if ! grep -q '^FRONTEND_VERSION=' .env; then
                echo "ERROR: FRONTEND_VERSION not found in .env"
                exit 1
              fi

              sed -i \
                "s/^FRONTEND_VERSION=.*/FRONTEND_VERSION=${FRONTEND_VERSION}/" \
                .env

              docker compose \
                -f docker-compose.prod.yml \
                pull frontend

              docker compose \
                -f docker-compose.prod.yml \
                up -d frontend
            fi

            echo ""
            echo "Current production versions:"

            grep -E \
              '^(BACKEND_VERSION|FRONTEND_VERSION)=' \
              .env
